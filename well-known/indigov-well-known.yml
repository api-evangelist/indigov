notes: >-
  Every /.well-known/ path returned a hard 404 on all three Indigov hosts — the
  marketing site (indigov.com), its www alias, and the customer application host
  (app.indigov.com, which redirects to /auth/signin). No security.txt, no OAuth or
  OIDC discovery document, no API catalog, no ai-plugin.json and no A2A agent card
  is served. Indigov DOES publish a responsible-disclosure policy, but as an
  ordinary web page at https://indigov.com/pages/responsible-disclosure rather than
  as an RFC 9116 security.txt, so the machine-readable discovery surface is empty.
  This artifact records a verified ABSENCE: no WellKnown or SecurityTxt pointer is
  wired into apis.yml, because no probed path returned a document.
excluded_hosts:
  - host: https://indigov.io
    reason: >-
      Parked domain, not an Indigov surface. NS records point at
      ns27/ns28.domaincontrol.com (GoDaddy parking) and the root serves a
      JavaScript redirect to /lander. Every path — including /openapi.json,
      /swagger.json and /.well-known/agent-card.json — answers HTTP 200 with the
      parking page's HTML, and /llms.txt returns generic parking boilerplate.
      Soft-200 on every path; treated as a miss and deliberately not recorded as
      evidence of any Indigov surface.
