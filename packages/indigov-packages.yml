notes: >-
  Indigov publishes six first-party npm packages under the @indigov scope, so the
  Packages pointer is real. NONE of them is a client SDK for an Indigov API:
  three are forks/wrappers of OTHER vendors' APIs (Zendesk, SparkPost, Plivo),
  two are clients for internal, undocumented Indigov services (flags, cansend),
  and one is a district/ZIP helper library. Indigov publishes no public API, so
  there is nothing for an SDK to wrap. NO `SDKs` pointer is wired in apis.yml —
  emitting one would credit Indigov with developer-facing client libraries it has
  not shipped.
  CURRENCY SIGNAL: only @indigov/zendesk-api has shipped since 2024 (0.0.109,
  2025-05-28). Four of the six last published in 2022–2023 and the scope has been
  quiet since the Granicus acquisition.
