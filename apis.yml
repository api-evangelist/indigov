aid: indigov
name: Indigov
description: >-
  Indigov is a constituent relationship management (CRM) platform purpose-built
  for government — U.S. Congressional offices, state legislatures, and municipal
  agencies — that unifies inbound constituent communications from email, web
  forms, SMS, social media, phone, and scanned mail into a single
  cross-organizational inbox. It layers casework tracking, constituent routing,
  smart tagging, and mass-email triage with rapid response, plus a customer data
  platform for sentiment and engagement analytics and an award-winning mobile app
  for field staff. Indigov serves government offices across 35 states and 2
  territories and was acquired by Granicus, joining its Government Experience
  Cloud (GXC). It was surfaced as a portfolio company of 8vc and added to the API
  Evangelist network for enrichment.
