description: >-
  Indigov publishes no rate limits, because Indigov publishes no API. Contract
  discovery found no developer portal, no API reference, no OpenAPI/Swagger
  document on any Indigov host, no GraphQL endpoint and no MCP server, so there
  is no request surface for which a limit, window, burst ceiling or throttling
  header could be documented.
notes: >-
  There is no published X-RateLimit-*, RateLimit-* or Retry-After convention to
  record, and no documented status code on exhaustion. The only Indigov request
  surface reachable on the public internet is the authenticated customer
  application at app.indigov.com, whose behaviour is not documented and was not
  probed (it requires customer credentials). limit_count is 0 as a measured
  fact. Any throughput ceilings that exist for a customer integration would be
  governed by the Indigov/Granicus customer agreement rather than a public
  policy.
